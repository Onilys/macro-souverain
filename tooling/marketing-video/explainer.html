<!doctype html>

<title>Macro explainer</title>

<style>
/* The long-form explainer: 16:9, about 80 s, led by a voiceover. A stack of apps that don't talk becomes one
   connected workspace, which unfolds into a flowchart of one demo call moving through Macro: the call is recorded,
   transcribed and summarized into team memory; an agent reads the call, the CRM and the email history, then updates
   the deal, makes tasks, proposes the onboarding and drafts the reply; you review and send; the team picks it up;
   search and your own MCP clients reach all of it. It folds back into one workspace and the end card.
   Every beat is timed from the voiceover's word clock (explainer-vo.js, built by vo/build_vo.py). */
@font-face { font-family: "Inter"; src: url("fonts/inter-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "display"; src: url("fonts/roboto-slab-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
:root { --bg: #f5f1e8; --rail: #efebe3; --panel: #e9e5dc; --surf: #ece8df; --tile: #dfdbd3; --ink: #1d1c1a; --body: #54524f; --lab: #72706c; --mut: #8f8c86;

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
html.render body { display: block; min-height: 0; }
#stage { position: relative; overflow: hidden; flex: none; background: var(--bg); color: var(--ink);
  font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-feature-settings: "cv11", "ss01"; }
#world, #screen, .layer { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.a { position: absolute; }
.flex { display: flex; align-items: center; }
.nowrap { white-space: nowrap; }
.ic { display: inline-block; flex: none; vertical-align: -3px; }

const TAU = Math.PI * 2;
// Closed-form unit step response of a damped spring. resp = undamped period (s), damp = damping ratio.
function spr(t, resp = 0.42, damp = 0.82) {
  if (t <= 0) return 0;
  const w = TAU / resp;
  if (damp >= 1) { const e = Math.exp(-w * t); return 1 - e * (1 + w * t); }
  const wd = w * Math.sqrt(1 - damp * damp), e = Math.exp(-damp * w * t);
  return 1 - e * (Math.cos(wd * t) + (damp * w / wd) * Math.sin(wd * t));
}
const mj = (x) => { x = clamp(x); return x * x * x * (10 + x * (-15 + 6 * x)); }; // minimum-jerk
const bell = (x) => (x <= 0 || x >= 1 ? 0 : 16 * x * x * (1 - x) * (1 - x));
// A value that changes target several times: one spring per change ([t, value, resp, damp]); the film plays once.
function Tr(evs) {
  const E = evs.map(([t, v, r, d]) => ({ t, v, r: r ?? 1, d: d ?? 0.9 }));

// ---------- connectors: rounded orthogonal routes, sampled for pulses ----------
function route(P, r = 18) {

  const pts = [[P[0][0], P[0][1]]];
  for (let i = 1; i < P.length; i++) {
    const [bx, by] = P[i];
    if (i < P.length - 1 && r > 0) {
      const [ax, ay] = P[i - 1], [cx, cy] = P[i + 1];
      const l1 = Math.hypot(bx - ax, by - ay), l2 = Math.hypot(cx - bx, cy - by), k = Math.min(r, l1 / 2, l2 / 2);
      const p1 = [bx - ((bx - ax) / l1) * k, by - ((by - ay) / l1) * k], p2 = [bx + ((cx - bx) / l2) * k, by + ((cy - by) / l2) * k];
      d += ` L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} Q${bx.toFixed(1)} ${by.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
      pts.push(p1);
      for (let j = 1; j <= 6; j++) { const u = j / 6, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u; pts.push([a * p1[0] + b * bx + c * p2[0], a * p1[1] + b * by + c * p2[1]]); }
    } else { d += ` L${bx.toFixed(1)} ${by.toFixed(1)}`; pts.push([bx, by]); }
  }
  let s = 0;
  const L = pts.map((p, i) => { if (i) s += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]); return [p[0], p[1], s]; });

}
function lutAt(L, u) {

  while (b - a > 1) { const m = (a + b) >> 1; if (P[m][2] < s) a = m; else b = m; }
  const p = P[a], q = P[b], f = q[2] > p[2] ? (s - p[2]) / (q[2] - p[2]) : 0;
  return [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f];
}

  if (o <= 0.003) { g.style.display = "none"; return; }
  g.style.display = "";
  const du = (11 * s) / L.len, f = (v) => lutAt(L, dir > 0 ? clamp(v) : 1 - clamp(v));
  const h = f(u), a = f(u - du), b = f(u - 2 * du), c = g.children;
  g.setAttribute("opacity", o.toFixed(3));
  const set = (n, p, r) => { n.setAttribute("cx", p[0].toFixed(2)); n.setAttribute("cy", p[1].toFixed(2)); n.setAttribute("r", (r * s).toFixed(2)); };
  set(c[0], h, 12); set(c[1], b, 2.4); set(c[2], a, 3.5); set(c[3], h, 4.8);
}

  {
    const env = sm((t - 0.3) / 1.5) * (1 - sm((t - END) / 0.6));
    const dx = env * (1.6 * Math.sin(t * 0.83 + 1.1) + 0.7 * Math.sin(t * 1.97 + 0.4)), dy = env * (1.3 * Math.sin(t * 0.61 + 2.3) + 0.6 * Math.sin(t * 1.49 + 1.7));
    const rot = env * (0.05 * Math.sin(t * 0.47 + 0.7) + 0.015 * Math.sin(t * 1.3));
    let z = Math.exp(LZ(t));
    for (const [tp, a] of [[BAR(0), 0.025], [END, 0.02]]) { const u = t - tp; if (u >= 0) z *= 1 + a * clamp(u / 0.025) * Math.exp(-u / 0.13); }
    CAM = { cx: CX(t), cy: CY(t), z, dx, dy };
    world.style.transform = `translate(${(W / 2 + dx).toFixed(3)}px,${(H / 2 + dy).toFixed(3)}px) rotate(${rot.toFixed(4)}deg) scale(${z.toFixed(5)}) translate(${(-CAM.cx).toFixed(3)}px,${(-CAM.cy).toFixed(3)}px)`;
  }
  const gOut = 1 - sm((t - END + 0.04) / 0.3);
  const z = CAM.z, sw = 1.7 / Math.pow(z, 0.72), ps = Math.pow(1 / z, 0.55);
  if (show(world, gOut)) {
    Object.keys(NL).forEach((k) => nodeFx(k, t));
    WL.forEach((w) => wireFx(w, t, sw, ps, 1 - sm((t - S.fold + 0.05) / 0.3)));
    RAILP.forEach((r) => {
      let x;
      if (r.amb) { if (t < r.t0 || t > S.fold) { show(r.g, 0); return; } const k = Math.floor((t - r.t0 - r.ph) / r.rep), t0 = r.t0 + r.ph + k * r.rep; x = k < 0 ? -1 : (t - t0) / r.dur; }
      else x = (t - r.t0) / r.dur;
      if (x < 0 || x >= 1.2) { show(r.g, 0); return; }
      pulseU(r.g, r.L, ease(clamp(x)), (r.amb ? 0.35 : 0.95) * Math.min(1, x / 0.06, (1.2 - x) / 0.2), ps, 1);
    });
    WL.forEach((w) => {
      if (!w.tagEl) return;
      const at = w.draw[0] + w.draw[1] * 0.5, p = t < at ? 0 : spr(t - at, 0.3, 0.7);
      fx(w.tagEl, clamp(p * 1.4) * (1 - sm((t - S.over) / 0.3)), 0, `translate3d(${px(w.tagP[0] - w.tagW / 2)},${px(w.tagP[1] - 13)},0) scale(${(Math.pow(1 / z, 0.5) * (0.8 + 0.2 * p)).toFixed(4)})`);
    });
    introFx(t, sw, ps);
    labelsFx(t);
  }
  headerFx(t);
  endFx(t);
  handsFx(t);
}

// ---------- the YouTube thumbnail (?thumb=1): the finished flowchart under a large title ----------
function thumb() {
  const t = S.over + 2.0;
  seek(t);
  show(LH, 0); show(LL, 0);
  Object.keys(NL).forEach((k) => show(E["lb_" + k], 0));
  world.style.transform = world.style.transform.replace(/^translate\(([-\d.]+)px,\s*([-\d.]+)px\)/, (m, x, y) => `translate(${x}px,${(+y + 112).toFixed(3)}px)`);
  add(scr, `<div class="layer" id="TH"><div class="a" style="left:0;top:0;width:${W}px;height:470px;background:linear-gradient(to bottom, var(--bg) 0, var(--bg) 400px, #f5f1e800 470px)"></div>
    <div class="a" style="left:72px;top:64px">${markSvg(84, "#141312")}</div>
    ${slabLine("thT", ["How", "Macro", "works"], 70, 300, 156)}
    <div class="a" style="left:76px;top:338px;font-size:40px;line-height:48px;color:var(--body);white-space:nowrap">Email, chat, docs, tasks, calls, CRM and AI agents, connected</div>
    <div class="a flex" style="left:${W - 72}px;transform:translateX(-100%);white-space:nowrap;top:84px;height:64px;padding:0 28px;border-radius:32px;background:var(--ink);color:#f5f1e8;font-size:30px;font-weight:600">80-second explainer</div></div>`);
}
// ---------- boot ----------
const params = new URLSearchParams(location.search);
window.seek = seek; window.DURATION = T; window.CUES = CUES; window.B = B; window.MUSIC = MUSIC; window.SONGS = { song: [SONG, 0] }; window.FMT = [W, H];
window.ready = Promise.all(['400 20px "Inter"', '500 20px "Inter"', '600 20px "Inter"', '700 20px "Inter"', '320 40px "display"', '400 16px "mono"'].map((f) => document.fonts.load(f)))
  .then(() => document.fonts.ready)
  .then(() => Promise.all([...document.querySelectorAll("[style*='url(img']")].map((a) => { const u = a.style.backgroundImage.match(/url\("?(.*?)"?\)/); if (!u) return 0; return new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = u[1]; }); })))
  .then(() => { init(); seek(0); if (params.has("thumb")) thumb(); return true; });
if (params.has("render")) document.documentElement.classList.add("render");
else {
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); Object.assign(stage.style, { position: "fixed", left: "50%", top: "50%", transformOrigin: "50% 50%", transform: `translate(-50%,-50%) scale(${k})` }); };
  addEventListener("resize", fit); fit();
  const at = params.has("t") ? parseFloat(params.get("t")) : null;
  window.ready.then(() => { if (at != null) { seek(at); return; } const t0 = performance.now(); const loop = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
