<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Macro launch</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* One-minute macro.com launch ad on the cream palette (apps/marketing cream preview and the cream Meta ads):
   page #f5f1e8, rail #efebe3, panels #e9e5dc, tiles #dfdbd3, body #54524f, labels #72706c, ink #1d1c1a.
   A "Notion wasn't built like Macro" (the leading Meta creative, animated in), B the unified-workspace
   orbit, C the platform cut, D a seven-feature carousel, E "Replace 27+ apps with a single system." */
@font-face { font-family: "Inter"; src: url("fonts/inter-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "display"; src: url("fonts/roboto-slab-variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
:root { --bg: #f5f1e8; --rail: #efebe3; --panel: #e9e5dc; --surf: #ece8df; --tile: #dfdbd3; --ink: #1d1c1a; --body: #54524f; --lab: #72706c; --mut: #8f8c86;
  --ok: #2e9e5b; --warn: #f59e0b; --doc: #7c5cd6; --blue: #5b9be6; --claude: #d97757; --red: #e5484d; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
html.render body { display: block; min-height: 0; }
#stage { position: relative; overflow: hidden; flex: none; background: var(--bg); color: var(--ink);
  font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-feature-settings: "cv11", "ss01"; }
#world, .layer { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.a { position: absolute; }
.flex { display: flex; align-items: center; }
.nowrap { white-space: nowrap; }
.ic { display: inline-block; flex: none; vertical-align: -3px; }
.lg svg { display: block; width: 100%; height: 100%; }
.slab { font-family: display; font-weight: 320; letter-spacing: -0.035em; line-height: 1; color: var(--ink); white-space: nowrap; }
.w { display: inline-block; }
.t1 { line-height: 1; white-space: nowrap; }  /* Inter at line-height 1: top = center - size / 2 */
/* cream surface (homepage-email-surface): panel, faint ink rim with a white 135° highlight, soft drop */
.card { position: absolute; background: var(--surf); border-radius: 30px; box-shadow: 0 10px 40px -12px #1d1c1a26; }
.card::after, .rim::after, .bub::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.card::after, .rim::after { background: linear-gradient(135deg, #ffffffb3, #ffffff00 45%), linear-gradient(#1d1c1a12, #1d1c1a12); }
/* chat bubble (cream [data-user-message-bubble]): page-colored, an even ink edge, soft drop; your own messages are ink */
.bub { position: relative; display: inline-block; background: var(--bg); border-radius: 28px; padding: 15px 22px; font-size: 22px; line-height: 31px; color: var(--ink);
  box-shadow: inset 0 1px 0 #1d1c1a0f, inset 0 -1px 0 #1d1c1a14, 0 14px 32px -22px #1d1c1a47; }
.bub::after { background: linear-gradient(to bottom, #1d1c1a0a 0%, transparent 35%, transparent 65%, #1d1c1a0c 100%), linear-gradient(#1d1c1a12, #1d1c1a12); }
.bub.me { background: var(--ink); color: #f5f1e8; box-shadow: 0 14px 32px -20px #1d1c1a99; }
.bub.me::after { background: linear-gradient(135deg, #ffffff38, #ffffff00 40%), linear-gradient(#ffffff10, #ffffff10); }
.bub.me .men, .bub.me .ref u { color: #f5f1e8; text-decoration-color: #f5f1e866; }
.bub.me .ref svg { fill: #cfcac0; }
.who { font-size: 16px; color: var(--lab); margin: 0 0 8px 2px; display: flex; gap: 7px; align-items: baseline; }
.who i { font-style: normal; font-size: 12px; color: var(--mut); }
.av { width: 44px; height: 44px; border-radius: 50%; flex: none; background-size: cover; background-position: center; box-shadow: inset 0 0 0 1px #1d1c1a14; }
.men { color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-color: #1d1c1a40; text-underline-offset: 4px; }
.ref { white-space: nowrap; }
.ref u { text-decoration-color: #1d1c1a40; text-underline-offset: 4px; color: var(--ink); }
.hair { position: absolute; left: 24px; right: 24px; height: 1px; background: #1d1c1a12; }
.lab { position: absolute; left: 0; right: 0; text-align: center; font-family: display; font-weight: 320; letter-spacing: -0.035em; line-height: 1; color: var(--ink); white-space: nowrap; }
.grid { position: absolute; left: 0; right: 0; font-size: 16px; color: var(--ink); }
.grid .r { position: absolute; left: 0; right: 0; height: 30px; border-bottom: 1px solid #1d1c1a12; display: flex; }
.grid .c { flex: none; border-right: 1px solid #1d1c1a12; padding: 0 8px; line-height: 30px; white-space: nowrap; overflow: hidden; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 18px; background: #1d1c1a0d; font-size: 16px; color: var(--ink); white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; font-size: 15px; font-weight: 500; white-space: nowrap; }
.tile { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.field { position: absolute; background: var(--panel); border-radius: 999px; box-shadow: inset 0 0 0 1px #1d1c1a12; }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 36px; padding: 0 10px; border-radius: 9px; background: #faf8f3;
  box-shadow: inset 0 0 0 1px #1d1c1a1f, 0 2px 0 #1d1c1a26; font-size: 18px; font-weight: 600; color: var(--ink); }
.disc { position: absolute; border-radius: 50%; background: #e4e0d8; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 26px -16px #1d1c1a4d, inset 0 1px 0 #ffffffa0, inset 0 0 0 1px #1d1c1a0a; }
.caret { display: inline-block; position: relative; width: 2px; height: 1.15em; vertical-align: -0.22em; background: var(--claude); margin-left: 2px; }
.caret b { position: absolute; left: 0; bottom: 100%; margin-bottom: 3px; background: var(--claude); color: #fff; font-size: 13px; line-height: 1; font-weight: 600; padding: 4px 7px; border-radius: 5px 5px 5px 0; white-space: nowrap; }
.menu { position: absolute; background: #f8f5ef; border-radius: 16px; box-shadow: 0 24px 48px -18px #1d1c1a59, inset 0 0 0 1px #1d1c1a14; }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: #1d1c1a0d; color: var(--lab); font-size: 13px; font-weight: 500; }
.ev { position: absolute; border-radius: 10px; overflow: hidden; padding: 8px 10px; font-size: 16px; line-height: 20px; white-space: nowrap; }

<script>
"use strict";
// ---------- formats: 9:16 (Reels/Stories), 4:5 (feed), 1:1 ----------
// The artboard is always 1080 wide (AH tall). A, B and E are laid out on the 1080×1350 grid of the
// 4:5 Meta creatives and fitted into each format.
const FMT = new URLSearchParams(location.search).get("fmt") || "45";
const [W, H] = { "916": [1080, 1920], "45": [1080, 1350], "11": [1440, 1440] }[FMT];
const K = W / 1080, AH = H / K;
const TALL = FMT === "916", SQ = FMT === "11";
const PS = SQ ? 0.8 : 1, PX0 = (1080 - 1080 * PS) / 2, PY0 = TALL ? 270 : (AH - 1350 * PS) / 2;
const SCA = { "916": 1.22, "45": 1.1, "11": 1.065 }[FMT];   // the platform cut's scale on the artboard
const pp = (x, y) => [PX0 + PS * x, PY0 + PS * y];           // creative grid → artboard

// ---------- music-driven timing ----------
// Upbeat: "Swish Swed" by Arulo (Mixkit 201), time-stretched 120 → 100 BPM (pitch kept), cut on its own structure:
// three bars of build-up under A and B; the first drop on beat 12 (the platform cut) runs through three slides and
// filters down into the breakdown on beat 52; its riser lands the second drop on beat 60; a breath of silence, then
// the end card hits on the top of the next phrase (beat 84).
// A 0–6 · B 6–12 · C 12–28 · D 28–84 (seven slides, eight beats each) · E 84–92. 92 beats = 55.2 s.
const MUSIC = [["upA", 100.0, Array(52).fill(1), { lpEnd: [1.25, 16000, 420] }], ["upB", 100.0, Array(32).fill(1), { gapEnd: 0.15 }], ["upC", 100.0, Array(8).fill(1)]];
const STEP_T = [0];
for (const [, bpm, beats] of MUSIC) for (const n of beats) STEP_T.push(STEP_T[STEP_T.length - 1] + (n * 60) / bpm);
const BEATS = STEP_T.length - 1, T = STEP_T[BEATS];
function B(x) { const k = Math.floor(x / BEATS), r = x - k * BEATS, i = Math.min(BEATS - 1, Math.floor(r)); return k * T + STEP_T[i] + (r - i) * (STEP_T[i + 1] - STEP_T[i]); }
function stepAt(t) { let i = 0; while (i < BEATS - 1 && STEP_T[i + 1] <= t) i++; return i + (t - STEP_T[i]) / (STEP_T[i + 1] - STEP_T[i]); }

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const sm = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const TAU = Math.PI * 2;

// Closed-form unit step response of a damped spring.
// resp = undamped period (s), damp = damping ratio (<1 gives a tiny overshoot).
function spr(t, resp = 0.42, damp = 0.82) {
  if (t <= 0) return 0;
  const w = TAU / resp;
  if (damp >= 1) { const e = Math.exp(-w * t); return 1 - e * (1 + w * t); }
  const wd = w * Math.sqrt(1 - damp * damp), e = Math.exp(-damp * w * t);
  return 1 - e * (Math.cos(wd * t) + (damp * w / wd) * Math.sin(wd * t));
}
// Free response from displacement x0 and velocity v0 (what a flung carousel does after the thumb lifts).
function free(t, x0, v0, resp, damp) {
  const w = TAU / resp, wd = w * Math.sqrt(1 - damp * damp), e = Math.exp(-damp * w * t);
  return e * (x0 * Math.cos(wd * t) + ((v0 + damp * w * x0) / wd) * Math.sin(wd * t));
}
const mj = (x) => { x = clamp(x); return x * x * x * (10 + x * (-15 + 6 * x)); }; // minimum-jerk
const bell = (x) => (x <= 0 || x >= 1 ? 0 : 16 * x * x * (1 - x) * (1 - x));

// A value that changes target many times is the sum of one spring per change.
// Periodic: every change also contributes from the previous loop (t + T), so the
// last frame flows into the first with matching position and velocity.
function Track(evs, resp = 0.42, damp = 0.82) {
  const E = evs.map(([bt, v, r, d]) => ({ t: B(bt), v, r: r ?? resp, d: d ?? damp }));
  const n = E.length;
  E.forEach((e, i) => { e.dv = e.v - E[(i + n - 1) % n].v; });
  const base = E[n - 1].v;
  return (t) => {
    let v = base;
    for (const e of E) if (e.dv !== 0) v += e.dv * (spr(t - e.t, e.r, e.d) + spr(t + T - e.t, e.r, e.d));
    return v;
  };
}

// Content enter/exit: its own timing, so swapped text never overlaps.
function visAmt(t, tin, tout, inResp = 0.3) {
  if (t < tin) return { pin: 0, pout: 0, o: 0 };
  const pin = spr(t - tin, inResp, 1);
  const pout = tout == null ? 0 : sm((t - tout) / 0.11);
  return { pin, pout, o: pin * (1 - pout) };
}

// the real logo (img/macro-logo.svg): the mark's three pieces and the MACRO letterforms, 126.4 units tall

const markSvg = (w, c) => `<svg width="${w}" height="${(w * 126.4) / 191.3}" viewBox="0 0 191.3 126.4" fill="${c}" style="display:block">${LOGO_MARK.map((d) => `<path d="${d}"/>`).join("")}</svg>`;
const claudeAv = (s) => glyphAv(ic("wide-claude", Math.round(s * 0.52), "#d97757"), s, "#f3e4da");
const cursorAv = (s) => glyphAv(cursorSvg(Math.round(s * 0.5)), s, "#1d1c1a");
const macroAv = (s) => glyphAv(markSvg(Math.round(s * 0.58), "#f5f1e8"), s, "#1d1c1a");
const ref = (icon, label) => `<span class="ref">${icon} <u>${label}</u></span>`;
const docIc = px_("file-text", 22, "var(--doc)"), pdfIc = px_("file-pdf", 22, "#d64545"), calIc = px_("calendar-blank", 22, "var(--body)"),
  callIc = px_("phone-call", 22, "var(--body)"), prIc = px_("git-pull-request", 21, "var(--ok)"), sheetIc = px_("table", 22, "var(--ok)");
const bubble = (id, side, av, who, body, extra = "") =>

    popScale(E.c_n, t, hm + 0.1, 0.7, 0.3, 0.8);

    const yk = spr(t - a2, 0.36, 0.86), y = lerp(468, 630, yk), h = lerp(152, 110, yk);
    if (show(E.c_hl, t >= a1 ? clamp(spr(t - a1, 0.22, 1) * 1.3) : 0)) { E.c_hl.style.top = px(y); E.c_hl.style.height = px(h); }
  },
  // CRM: the call updates the company record
  (t, s) => {
    pop(E.r_act, t, at_(s, 1), 10, 0.3);
    const flash = (a) => (t < a ? 0 : Math.exp(-(t - a) * 2.4));
    const v0 = t >= at_(s, 1.6), v1 = t >= at_(s, 2.2);
    setHtml(E.r_v0, v0 ? T1(8, 17, 25, "Today, 9:41 AM") : T1(8, 17, 25, "Sep 22, 3:10 PM", "color:var(--body)"));
    setHtml(E.r_v1, v1 ? T1(16, 18, 23, `Customer&nbsp; ${px_("caret-down", 18)}`) : T1(16, 18, 23, `Pilot&nbsp; ${px_("caret-down", 18)}`));
    const rc = clamp((t - at_(s, 2.8)) / (at_(s, 3.6) - at_(s, 2.8))), rv = 8000 + Math.round(rc * 8) * 500;
    setHtml(E.r_v2, T1(12, 18, 23, rv.toLocaleString("en-US")));
    [[E.r_v0, flash(at_(s, 1.6)), 260], [E.r_v1, flash(at_(s, 2.2)), 190], [E.r_v2, Math.max(flash(at_(s, 2.8)), rc > 0 && rc < 1 ? 1 : flash(at_(s, 3.6))), 120]].forEach(([n, f, w]) => {
      n.style.width = px(w); n.style.borderRadius = "10px"; n.style.background = `rgba(29,28,26,${(0.09 * f).toFixed(3)})`;
    });
    pop(E.r_dana, t, at_(s, 4), 10, 0.28);
  },
  // CALENDAR: the cursor copies the link; the week fills with bookings
  (t, s) => {
    const cp = B(69.25), press = t >= cp ? Math.exp(-(t - cp) * 9) : 0;
    E.k_copy.style.transform = `scale(${(1 - 0.06 * press).toFixed(3)})`;
    show(E.k_c0, t < cp ? 1 : 0); show(E.k_c1, t >= cp ? 1 : 0);
    BOOK.forEach((_, i) => popScale(E["k_b" + i], t, at_(s, 1.9 + i * 0.55 + 0.04 * Math.sin(i * 2.3)), 0.6, 0.3, 0.6 + 0.04 * (i % 2)));
    popScale(E.k_sum, t, at_(s, 4.7), 0.7, 0.3, 0.7);
  },
  // AGENTS: type the question, send it with a tap; Macro searches team memory and answers with sources
  (t, s) => {
    const n = QWORDS.reduce((a, _, i) => a + (t >= at_(s, 0.3 + i * 0.19) ? 1 : 0), 0), sent = at_(s, 2.2);
    setHtml(E.g_ct, t >= sent || n === 0 ? `<span style="color:var(--mut)">Ask Macro about anything in your workspace…</span>` : QWORDS.slice(0, n).map((w, i) => (i === 0 ? `<span class="men">${w}</span>` : w)).join(" ") + `<span class="caret" style="background:var(--ink)"></span>`);
    const armed = n > 0 && t < sent;
    E.g_send.style.background = armed ? "var(--ink)" : "#d8d4cc";
    E.g_send.firstElementChild.setAttribute("fill", armed ? "#f5f1e8" : "#3d3b37");
    if (t >= sent) { const p = spr(t - sent, 0.5, 0.8); fx(E.g_q, clamp(spr(t - sent, 0.12, 1) * 1.4), (1 - clamp(p)) * 3, `translate3d(${px((1 - p) * 40)},${px((1 - p) * 600)},0) scale(${(0.92 + 0.08 * p).toFixed(4)})`); } else show(E.g_q, 0);
    pop(E.g_h, t, at_(s, 2.6), 8, 0.3); pop(E.g_n, t, at_(s, 2.65), 8, 0.3);
    STEPS.forEach((_, i) => {
      const a = at_(s, 2.85 + i * 0.38), done = a + (0.3 + 0.05 * (i % 2)) * 0.6;
      pop(E["g_s" + i], t, a, 8, 0.24);
      show(E["g_sp" + i], t < done ? 1 : 0); E["g_sp" + i].style.transform = `rotate(${((t - a) * 540).toFixed(1)}deg)`;
      popScale(E["g_sc" + i], t >= done ? t : -1, done, 0.4, 0.24, 0.6);
    });
    ANSWER.forEach((_, i) => write(E["g_a" + i], t, at_(s, 4.45 + i * 0.45), at_(s, 4.45 + i * 0.45 + 0.5)));
    SRC.forEach((_, i) => popScale(E["g_c" + i], t, at_(s, 5.95 + i * 0.12), 0.6, 0.28, 0.65));
  },
];

window.SONGS = { upA: [SONG, 40.8382], upB: [SONG, 120.0382], upC: [SONG, 144.0382] };
window.seek = seek; window.DURATION = T; window.CUES = CUES; window.B = B; window.MUSIC = MUSIC; window.FMT = [W, H];
window.probe = (t) => [LKX(t), LKY(t), LKS(t), posAt(t), 0, 0, 0, 0, 0, 0, 0, 0, 0];
window.ready = Promise.all(['400 20px "Inter"', '500 20px "Inter"', '600 20px "Inter"', '320 40px "display"'].map((f) => document.fonts.load(f)))
  .then(() => document.fonts.ready)
  .then(() => Promise.all([...document.querySelectorAll(".av"), ...document.querySelectorAll("[style*='url(img']")].map((a) => { const u = a.style.backgroundImage.match(/url\("?(.*?)"?\)/); if (!u) return 0; return new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = u[1]; }); })))
  .then(() => { PATHLEN = CALL.map((_, i) => E["acl" + i].getTotalLength()); seek(0); return true; });
const params = new URLSearchParams(location.search);
if (params.has("render")) document.documentElement.classList.add("render");
else {
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); Object.assign(stage.style, { position: "fixed", left: "50%", top: "50%", transformOrigin: "50% 50%", transform: `translate(-50%,-50%) scale(${k})` }); };
  addEventListener("resize", fit); fit();
  const at = params.has("t") ? parseFloat(params.get("t")) : null;
  window.ready.then(() => { if (at != null) { seek(at); return; } const t0 = performance.now(); const loop = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
