# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/cargo_workspace_dependency_check.rs
name: cargo workspace dependency check
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    branches:
    - main
    paths:
    - Cargo.toml
    - crates/**/Cargo.toml
    - services/**/Cargo.toml
    - tooling/xtask/**/Cargo.toml
    - Cargo.lock
    - '.config/hakari.toml'
    - crates/workspace-hack/**
    - tooling/xtask/src/**
    - tooling/xtask/crates/xtask_deps/**
    - tooling/xtask/crates/xtask_graph/**
    - '.github/workspace-dep-closures.json'
jobs:
  dependency-check:
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=sccache-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: rust
        path: |-
          /nix
          /home/runner/.cache/kache
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Configure kache
      run: |
        set -euo pipefail
        {
          echo "KACHE_CACHE_DIR=$KACHE_VOLUME_DIR"
          echo "KACHE_MAX_SIZE=$KACHE_VOLUME_MAX_SIZE"
          echo "KACHE_RUNTIME_DIR=$RUNNER_TEMP/kache"
        } >> "$GITHUB_ENV"
        if [ "$TRUSTED" != true ]; then
          echo "KACHE_LOCAL_ONLY=1" >> "$GITHUB_ENV"
        elif [ -z "$R2_ACCESS_KEY" ] || [ -z "$R2_SECRET_KEY" ]; then
          echo "::warning::KACHE_R2_* secrets are not set; kache uses only the volume store"
          echo "KACHE_LOCAL_ONLY=1" >> "$GITHUB_ENV"
        else
          # Listing lets the daemon prefetch from the key index before rustc
          # asks; test binaries alone exceed the default 2 GiB plan.
          {
            echo "KACHE_S3_ACCESS_KEY=$R2_ACCESS_KEY"
            echo "KACHE_S3_SECRET_KEY=$R2_SECRET_KEY"
            echo "KACHE_REMOTE_KEY_LISTING=1"
            echo "KACHE_PREFETCH_MAX_BYTES=16GiB"
          } >> "$GITHUB_ENV"
        fi
      shell: bash
      env:
        KACHE_VOLUME_DIR: /home/runner/.cache/kache
        KACHE_VOLUME_MAX_SIZE: '30GiB'
        TRUSTED: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository }}
        R2_ACCESS_KEY: ${{ secrets.KACHE_R2_ACCESS_KEY_ID }}
        R2_SECRET_KEY: ${{ secrets.KACHE_R2_SECRET_ACCESS_KEY }}
    - name: install tool
      run: cargo install cargo-workspace-dependency-checker@1.0.1
    - name: check
      run: |
        # workspace-hack (generated, see xtask) re-declares third-party deps
        # with explicit versions by design — that is how it pins union
        # features. Drop it from the member list so this check only polices
        # human-written crates for duplicate dependencies.
        sed -i '/^  "crates\/workspace-hack",$/d' Cargo.toml
        cargo-workspace-dependency-checker
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  hakari-and-dep-closures:
    runs-on: namespace-profile-linux-rust-ci;overrides.cache-tag=sccache-ci
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: rust
        path: |-
          /nix
          /home/runner/.cache/kache
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
    - name: Configure kache
      run: |
        set -euo pipefail
        {
          echo "KACHE_CACHE_DIR=$KACHE_VOLUME_DIR"
          echo "KACHE_MAX_SIZE=$KACHE_VOLUME_MAX_SIZE"
          echo "KACHE_RUNTIME_DIR=$RUNNER_TEMP/kache"
        } >> "$GITHUB_ENV"
        if [ "$TRUSTED" != true ]; then
          echo "KACHE_LOCAL_ONLY=1" >> "$GITHUB_ENV"
        elif [ -z "$R2_ACCESS_KEY" ] || [ -z "$R2_SECRET_KEY" ]; then
          echo "::warning::KACHE_R2_* secrets are not set; kache uses only the volume store"
          echo "KACHE_LOCAL_ONLY=1" >> "$GITHUB_ENV"
        else
          # Listing lets the daemon prefetch from the key index before rustc
          # asks; test binaries alone exceed the default 2 GiB plan.
          {
            echo "KACHE_S3_ACCESS_KEY=$R2_ACCESS_KEY"
            echo "KACHE_S3_SECRET_KEY=$R2_SECRET_KEY"
            echo "KACHE_REMOTE_KEY_LISTING=1"
            echo "KACHE_PREFETCH_MAX_BYTES=16GiB"
          } >> "$GITHUB_ENV"
        fi
      shell: bash
      env:
        KACHE_VOLUME_DIR: /home/runner/.cache/kache
        KACHE_VOLUME_MAX_SIZE: '30GiB'
        TRUSTED: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository }}
        R2_ACCESS_KEY: ${{ secrets.KACHE_R2_ACCESS_KEY_ID }}
        R2_SECRET_KEY: ${{ secrets.KACHE_R2_SECRET_ACCESS_KEY }}
    - name: generated dependency artifacts are up to date
      run: |
        cargo run -p xtask --locked -- deps --check
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
concurrency:
  group: cargo-workspace-dependency-check-${{ github.ref }}
  cancel-in-progress: true
