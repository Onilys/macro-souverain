  build-appimage:
    needs:
    - resolve-ref
    name: Build AppImage
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=desktop-linux
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ needs.resolve-ref.outputs.ref }}
        persist-credentials: 'false'
    - name: Mount /nix cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
      continue-on-error: true
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - id: metadata
      name: Derive artifact metadata
      run: |
        set -euo pipefail
        tag="${RAW_REF#refs/tags/}"
        if [ -z "$tag" ]; then
          tag="${GITHUB_REF_NAME:-untagged}"
        fi
        safe_tag=$(printf '%s' "$tag" | sed 's#[/\\:*?"<>|]#-#g' | tr -d '\r\n')
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "safe_tag=$safe_tag" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        RAW_REF: ${{ needs.resolve-ref.outputs.ref }}
    - name: Prepare desktop release identity
      run: nix develop --command bun apps/web/scripts/desktop-release.mjs prepare "$RAW_REF"
      shell: bash
      env:
        RAW_REF: ${{ needs.resolve-ref.outputs.ref }}
    - name: Build AppImage with Nix
      run: |
        set -euo pipefail

        # Vite inlines this into the bundle at build time; without it the shipped
        # desktop app never initializes PostHog and every feature flag reads as off.
        # `--impure` below is what lets Nix evaluation see it.
        : "${VITE_POSTHOG_API_KEY:?must be set from the POSTHOG_API_KEY secret so desktop feature flags work}"

        restart_nix_daemon() {
          echo "::warning::Restarting nix-daemon before retrying AppImage build."
          sudo systemctl restart nix-daemon.service 2>/dev/null || true
          sudo pkill -x nix-daemon 2>/dev/null || true
          sudo rm -f /nix/var/nix/daemon-socket/socket
          sudo mkdir -p /nix/var/nix/daemon-socket
          sudo sh -c 'nohup /nix/var/nix/profiles/default/bin/nix-daemon >/tmp/nix-daemon-retry.log 2>&1 &'
          for _ in $(seq 1 30); do
            if sudo test -S /nix/var/nix/daemon-socket/socket; then
              return 0
            fi
            sleep 1
          done
          echo "nix-daemon failed to restart; log follows:" >&2
          sudo cat /tmp/nix-daemon-retry.log >&2 || true
          return 1
        }

        build_appimage() {
          local attempt="$1"
          local -a fallback_args=()
          if [ "$attempt" -eq 3 ]; then
            fallback_args=(--fallback)
          fi

          # Force a hermetic Nix sandbox for linuxdeploy. Namespace's restored
          # Nix daemon can otherwise run unsandboxed under /nix/var/nix/builds,
          # where linuxdeploy sees host libraries/tools and can fail with only
          # `failed to run linuxdeploy` in Tauri's default output.
          # --impure only relaxes *evaluation* purity, so the frontend derivation can
          # read VITE_POSTHOG_API_KEY from the environment; the build sandbox below is
          # unaffected.
          nix build \
            "${fallback_args[@]}" \
            --impure \
            --option sandbox true \
            --option sandbox-build-dir /build \
            --option download-attempts 10 \
            --print-build-logs \
            ".#tauri-desktop-appimage"
        }

        for attempt in 1 2 3; do
          if build_appimage "$attempt"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          echo "::warning::AppImage nix build failed on attempt $attempt; retrying."
          restart_nix_daemon
          sleep $((attempt * 10))
        done
      shell: bash
      env:
        VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
    - name: Collect AppImage artifact
      run: |
        set -euo pipefail
        mkdir -p artifacts
        shopt -s nullglob
        appimages=(result/*.AppImage)
        if [ "${#appimages[@]}" -eq 0 ]; then
          echo "No AppImage files found in nix build result" >&2
          find -L result -maxdepth 2 -type f -print >&2 || true
          exit 1
        fi
        cp -v "${appimages[@]}" artifacts/
        chmod 0755 artifacts/*.AppImage
        cp apps/web/tauri/desktop-release.json artifacts/linux-x86_64.release.json
        (cd artifacts && sha256sum -- *.AppImage > macro-appimage-SHA256SUMS)
      shell: bash
    - name: Upload macro-appimage-${{ steps.metadata.outputs.safe_tag }} artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macro-appimage-${{ steps.metadata.outputs.safe_tag }}
        path: artifacts/*
        if-no-files-found: error
        retention-days: '30'
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  build-dmg:
    needs:
    - resolve-ref
    name: Build macOS DMG
    runs-on:
    - nscloud-macos-sequoia-arm64-12x28-with-cache
    - nscloud-cache-tag-macro-desktop-macos
    - nscloud-cache-size-100gb
    env:
      DESKTOP_NIX_CACHE_SIZE_GB: '100'
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ needs.resolve-ref.outputs.ref }}
        persist-credentials: 'false'
    - name: Assert arm64 runner
      run: |
        set -euo pipefail
        if [ "$(uname -m)" != "arm64" ]; then
          echo "macOS DMG builds must run on an arm64/aarch64 runner, got $(uname -m)" >&2
          exit 1
        fi
      shell: bash
    - name: Mount macOS Nix binary cache
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        path: ~/.cache/macro-desktop-nix
      continue-on-error: true
    - name: Install Nix
      run: |
        set -euo pipefail
        if ! command -v nix >/dev/null 2>&1; then
          curl --http1.1 --retry 5 --retry-delay 5 --retry-all-errors \
            --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | \
            sh -s -- install macos --no-confirm \
            --extra-conf "experimental-features = nix-command flakes" \
            --extra-conf "sandbox = false" \
            --extra-conf "trusted-users = root runner"
        fi
        echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
        echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"
        export PATH="/nix/var/nix/profiles/default/bin:$PATH"
        export NIX_REMOTE=daemon
        nix --version
      shell: bash
    - id: nix-cache
      name: Configure macOS Nix binary cache
      run: |
        set -euo pipefail

        # The Apple linker/SDK live outside Nix. Do not reuse their outputs after the
        # runner image changes its macOS or Xcode version.
        toolchain_key=$(
          { xcodebuild -version && sw_vers -buildVersion; } |
            shasum -a 256 | awk '{print $1}'
        )
        cache_root="$HOME/.cache/macro-desktop-nix"
        cache_dir="$cache_root/$toolchain_key"
        mkdir -p "$cache_dir"
        cache_url="file://$cache_dir?compression=zstd&trusted=true&priority=10"

        # The mounted cache root is a symlink; the trailing slash measures its contents.
        du -sk "$cache_root/" | awk '{printf "Restored macOS Nix cache: %.2f GiB\n", $1 / 1048576}'

        # Initialize an empty cache before adding it as a substituter. Only this local,
        # repository-specific cache accepts unsigned paths; public caches still require
        # signatures. Keep the normal /nix store and its daemon-managed permissions.
        nix store info --store "$cache_url" --json
        {
          echo "DESKTOP_NIX_CACHE_ROOT=$cache_root"
          echo "DESKTOP_NIX_CACHE_DIR=$cache_dir"
          echo "DESKTOP_NIX_CACHE_URL=$cache_url"
          echo "NIX_CONFIG<<DESKTOP_NIX_CONFIG_EOF"
          printf '%s\n' "${NIX_CONFIG:-}"
          echo "extra-substituters = $cache_url"
          echo "DESKTOP_NIX_CONFIG_EOF"
        } >> "$GITHUB_ENV"
      shell: bash
      continue-on-error: true
    - name: Configure signing identity
      run: |
        set -euo pipefail
        if [ -z "${MACOS_DEVELOPER_ID_CERTIFICATE_BASE64}" ] || [ -z "${MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD}" ]; then
          echo "Developer ID certificate secrets are not configured; using ad-hoc signing for build validation."
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          exit 0
        fi

        certificate_path="$RUNNER_TEMP/developer-id-application.p12"
        printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path" 2>/dev/null \
          || printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"

        # Nix's macOS daemon builds as _nixbld users, not the runner user.
        # Put the Developer ID identity in the system keychain so codesign can
        # find it from inside the Nix build without embedding certificate
        # secrets into the derivation.
        sudo security import "$certificate_path" \
          -k /Library/Keychains/System.keychain \
          -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
          -A \
          -T /usr/bin/codesign \
          -T /usr/bin/security
        sudo security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s \
          -k "" \
          /Library/Keychains/System.keychain || true

        identity=$(security find-identity -v -p codesigning /Library/Keychains/System.keychain \
          | awk -F '"' '/Developer ID Application/ { print $2; exit }')
        if [ -z "$identity" ]; then
          echo "No Developer ID Application identity found in System.keychain" >&2
          security find-identity -v -p codesigning /Library/Keychains/System.keychain >&2 || true
          exit 1
        fi
        echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
        echo "Using signing identity: $identity"
      shell: bash
      env:
        MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
        MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
    - id: metadata
      name: Derive artifact metadata
      run: |
        set -euo pipefail
        tag="${RAW_REF#refs/tags/}"
        if [ -z "$tag" ]; then
          tag="${GITHUB_REF_NAME:-untagged}"
        fi
        safe_tag=$(printf '%s' "$tag" | sed 's#[/\\:*?"<>|]#-#g' | tr -d '\r\n')
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "safe_tag=$safe_tag" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        RAW_REF: ${{ needs.resolve-ref.outputs.ref }}
    - name: Prepare desktop release identity
      run: nix develop --command bun apps/web/scripts/desktop-release.mjs prepare "$RAW_REF"
      shell: bash
      env:
        RAW_REF: ${{ needs.resolve-ref.outputs.ref }}
    - name: Build DMG with Nix
      run: |
        set -euo pipefail

        # Vite inlines this into the bundle at build time; without it the shipped
        # desktop app never initializes PostHog and every feature flag reads as off.
        # Everything below is already `--impure`, which is what lets Nix evaluation
        # see it — including the path-info pass, so the recorded cache roots match
        # what the builds produce.
        : "${VITE_POSTHOG_API_KEY:?must be set from the POSTHOG_API_KEY secret so desktop feature flags work}"

        # Record the derivations before building so completed dependencies can be saved
        # even if a later compilation or packaging step fails.
        nix path-info --derivation --impure \
          ".#packages.aarch64-darwin.tauri-desktop-apple-linker-smoke" \
          ".#packages.aarch64-darwin.tauri-desktop-dmg" \
          > "$RUNNER_TEMP/desktop-cache-roots"

        nix build --impure --option sandbox false --print-build-logs \
          ".#packages.aarch64-darwin.tauri-desktop-apple-linker-smoke"
        nix build --impure --option sandbox false --print-build-logs \
          ".#packages.aarch64-darwin.tauri-desktop-dmg"
      shell: bash
      env:
        VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
    - name: Prune and save macOS Nix build dependencies
      if: '!cancelled() && steps.nix-cache.outcome == ''success'''
      run: |
        set -euo pipefail
        export LC_ALL=C

        roots_file="$RUNNER_TEMP/desktop-cache-roots"
        if [ ! -s "$roots_file" ]; then
          exit 0
        fi

        cache_root="${DESKTOP_NIX_CACHE_ROOT:?}"
        cache_dir="${DESKTOP_NIX_CACHE_DIR:?}"
        toolchain_key="${cache_dir#"$cache_root/"}"
        if [ "${#toolchain_key}" -ne 64 ] || [[ "$toolchain_key" == *[!0-9a-f]* ]] \
          || [ "$cache_dir" != "$cache_root/$toolchain_key" ] \
          || [ -L "$cache_dir" ] || [ -L "$cache_dir/nar" ]; then
          echo "Refusing to prune an unexpected macOS Nix cache directory: $cache_dir" >&2
          exit 1
        fi

        work_dir=$(mktemp -d "$RUNNER_TEMP/desktop-cache-prune.XXXXXX")
        trap 'rm -rf "$work_dir"' EXIT
        shopt -s nullglob dotglob

        report_size() {
          cache_size_kib=$(du -sk "$cache_root/" | awk '{print $1}')
          local message
          message=$(awk -v phase="$1" -v kib="$cache_size_kib" \
            'BEGIN {printf "macOS Nix cache %s: %.2f GiB", phase, kib / 1048576}')
          echo "$message"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf -- '- %s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
        }
        report_size "before pruning"

        # A DMG's runtime closure omits build-only inputs such as Cargo artifacts and
        # the toolchain. Walk its derivation closure and include every existing output,
        # including successful dependencies of an otherwise failed build.
        while IFS= read -r derivation; do
          nix-store --query --requisites --include-outputs "$derivation"
        done < "$roots_file" |
          sort -u > "$work_dir/requisites"
        awk '!/\.drv$/' "$work_dir/requisites" > "$work_dir/paths"

        # Finish enumeration and validate metadata before deleting anything. An empty
        # closure or a failed query must leave the previous cache intact.
        if [ ! -s "$work_dir/paths" ]; then
          echo "No completed Nix outputs to cache; leaving the cache intact."
          exit 0
        fi
        # An early failure may leave current dependencies in the binary cache without
        # having restored them locally. Keep their planned outputs too, while exporting
        # only the realized paths above. Bound argv size for macOS's smaller limit.
        awk '/\.drv$/' "$work_dir/requisites" > "$work_dir/derivations"
        : > "$work_dir/planned-paths"
        if [ -s "$work_dir/derivations" ]; then
          xargs -n 128 nix-store --query --outputs < "$work_dir/derivations" > "$work_dir/planned-paths"
        fi
        awk -F/ '
          NF != 4 || $2 != "nix" || $3 != "store" {exit 1}
          {
            split($4, parts, "-")
            if (length(parts[1]) != 32 || parts[1] ~ /[^0123456789abcdfghijklmnpqrsvwxyz]/) exit 1
            print parts[1] ".narinfo"
          }
        ' "$work_dir/paths" "$work_dir/planned-paths" | sort -u > "$work_dir/wanted-narinfos"
        for metadata in "$cache_dir"/*.narinfo; do
          printf '%s\n' "${metadata##*/}"
        done | sort -u > "$work_dir/all-narinfos"
        comm -12 "$work_dir/all-narinfos" "$work_dir/wanted-narinfos" > "$work_dir/retained-narinfos"
        comm -23 "$work_dir/all-narinfos" "$work_dir/wanted-narinfos" > "$work_dir/remove-narinfos"
        : > "$work_dir/retained-nars"

        while IFS= read -r metadata; do
          nar_url=""
          store_path=""
          while read -r field value; do
            case "$field" in
              URL:) nar_url="$value" ;;
              StorePath:) store_path="$value" ;;
            esac
          done < "$cache_dir/$metadata"
          nar_file="${nar_url#nar/}"
          if [[ "$nar_url" != nar/* ]] || [[ "$nar_file" == *[!a-zA-Z0-9._-]* ]] \
            || [[ "$nar_file" == .* ]] || [ -z "$nar_file" ] \
            || [[ "$store_path" != /nix/store/"${metadata%.narinfo}"-* ]] \
            || [ -L "$cache_dir/$metadata" ]; then
            echo "Invalid retained Nix cache metadata: $metadata; leaving the cache intact." >&2
            exit 1
          fi
          if [ -f "$cache_dir/$nar_url" ] && [ ! -L "$cache_dir/$nar_url" ]; then
            printf '%s\n' "$nar_url" >> "$work_dir/retained-nars"
          else
            # Nix checks narinfo existence, not archive existence. Remove dangling
            # metadata so the subsequent copy repairs this path instead of skipping it.
            printf '%s\n' "$metadata" >> "$work_dir/remove-narinfos"
          fi
        done < "$work_dir/retained-narinfos"
        sort -u -o "$work_dir/retained-nars" "$work_dir/retained-nars"
        for archive in "$cache_dir"/nar/*; do
          printf 'nar/%s\n' "${archive##*/}"
        done | sort -u > "$work_dir/all-nars"
        # Different store paths may share one compressed archive. Retain the union of
        # their URLs so removing one obsolete narinfo cannot break a current path.
        comm -23 "$work_dir/all-nars" "$work_dir/retained-nars" > "$work_dir/remove-nars"

        while IFS= read -r metadata; do
          rm -f "$cache_dir/$metadata"
        done < "$work_dir/remove-narinfos"
        while IFS= read -r archive; do
          rm -f "$cache_dir/$archive"
        done < "$work_dir/remove-nars"
        for partition in "$cache_root"/*; do
          partition_key="${partition##*/}"
          if [ "${#partition_key}" -eq 64 ] && [[ "$partition_key" != *[!0-9a-f]* ]] \
            && [ "$partition" != "$cache_dir" ] && [ -d "$partition" ] && [ ! -L "$partition" ]; then
            rm -rf "$partition"
          fi
        done
        printf 'Pruned %s metadata entries and %s archives; retaining %s current store paths.\n' \
          "$(wc -l < "$work_dir/remove-narinfos" | tr -d ' ')" \
          "$(wc -l < "$work_dir/remove-nars" | tr -d ' ')" \
          "$(wc -l < "$work_dir/wanted-narinfos" | tr -d ' ')"
        report_size "after pruning"

        export_started=$SECONDS
        copy_status=0
        nix copy --stdin --to "$DESKTOP_NIX_CACHE_URL" < "$work_dir/paths" || copy_status=$?
        echo "Nix cache export took $((SECONDS - export_started)) seconds."
        report_size "after export"
        if (( cache_size_kib * 1024 >= ${DESKTOP_NIX_CACHE_SIZE_GB:-100} * 1000000000 )); then
          echo "::warning::The current Nix build closure exceeds the configured cache capacity even after pruning; Namespace may start the next build cold."
        fi
        exit "$copy_status"
      shell: bash
      continue-on-error: true
    - name: Collect DMG artifact
      run: |
        set -euo pipefail
        mkdir -p artifacts
        shopt -s nullglob
        dmgs=(result/*.dmg)
        if [ "${#dmgs[@]}" -eq 0 ]; then
          echo "No DMG files found in nix build result" >&2
          find -L result -maxdepth 2 -type f -print >&2 || true
          exit 1
        fi
        cp -v "${dmgs[@]}" artifacts/
        # Nix outputs are read-only; stapler must write Apple's ticket into the copy.
        chmod u+w artifacts/*.dmg
        mkdir -p updater-app
        cp -a result/Macro.app updater-app/
        chmod -R u+w updater-app/Macro.app
        cp apps/web/tauri/desktop-release.json artifacts/darwin-aarch64.release.json
      shell: bash
    - name: Validate signed DMG
      run: |
        set -euo pipefail
        dmg=$(find artifacts -maxdepth 1 -type f -name '*.dmg' -print -quit)
        if [ -z "$dmg" ]; then
          echo "No DMG found to validate" >&2
          exit 1
        fi
        codesign --verify --strict --verbose=2 "$dmg"

        mount_dir=$(mktemp -d)
        hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
        trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" >/dev/null 2>&1 || true' EXIT
        app=$(find "$mount_dir" -maxdepth 2 -type d -name '*.app' -print -quit)
        if [ -z "$app" ] && [ -d "$mount_dir/Contents" ]; then
          app="$mount_dir"
        fi
        if [ -z "$app" ]; then
          echo "No app bundle found in DMG" >&2
          find "$mount_dir" -maxdepth 2 -print >&2 || true
          exit 1
        fi
        codesign --verify --deep --strict --verbose=2 "$app"

        dylib_refs=$(mktemp)
        search_roots=("$app/Contents/MacOS")
        if [ -d "$app/Contents/Frameworks" ]; then
          search_roots+=("$app/Contents/Frameworks")
        fi
        while IFS= read -r -d '' file; do
          otool -L "$file" 2>/dev/null \
            | awk -v file="$file" 'NR > 1 && $1 ~ "^/nix/store/.*\\.dylib$" { print file ": " $1 }' \
            >> "$dylib_refs" || true
        done < <(find "${search_roots[@]}" -type f -print0)
        if [ -s "$dylib_refs" ]; then
          echo "App bundle contains absolute Nix dylib references:" >&2
          cat "$dylib_refs" >&2
          exit 1
        fi
      shell: bash
    - name: Notarize and staple DMG
      run: |
        set -euo pipefail

        if [ -z "${DOPPLER_TOKEN:-}" ]; then
          echo "MACOS_RELEASE_DOPPLER_TOKEN must grant read access to macos-release/prd" >&2
          exit 1
        fi
        dmg=$(find artifacts -maxdepth 1 -type f -name '*.dmg' -print -quit)
        if [ -z "$dmg" ]; then
          echo "No DMG found to notarize" >&2
          exit 1
        fi

        umask 077
        credentials_dir=$(mktemp -d)
        trap 'rm -rf "$credentials_dir"' EXIT
        curl --fail --silent --show-error --retry 3 \
          --header "Authorization: Bearer $DOPPLER_TOKEN" \
          'https://api.doppler.com/v3/configs/config/secrets/download?project=macos-release&config=prd&format=json&secrets=APPLE_API_PRIVATE_KEY,APPLE_API_KEY_ID,APPLE_API_ISSUER' \
          > "$credentials_dir/secrets.json"
        jq -er '.APPLE_API_PRIVATE_KEY | strings | select(length > 0)' \
          "$credentials_dir/secrets.json" > "$credentials_dir/AuthKey.p8"
        key_id=$(jq -er '.APPLE_API_KEY_ID | strings | select(length > 0)' "$credentials_dir/secrets.json")
        issuer=$(jq -er '.APPLE_API_ISSUER | strings | select(length > 0)' "$credentials_dir/secrets.json")

        probe_https() {
          local label="$1" url="$2" family="${3:-}" status=0
          local -a curl_args=(--silent --show-error --output /dev/null --connect-timeout 5 --max-time 10)
          if [ -n "$family" ]; then
            curl_args+=("$family")
          fi
          echo "$label HTTPS probe (an HTTP error still confirms connectivity):"
          curl "${curl_args[@]}" \
            --write-out 'remote_ip=%{remote_ip} http=%{http_code} dns_s=%{time_namelookup} tcp_s=%{time_connect} tls_s=%{time_appconnect} total_s=%{time_total}\n' \
            "$url" || status=$?
          echo "$label curl_exit=$status"
        }

        cloudkit_diagnostics() {
          echo '::group::CloudKit connection diagnostics'
          date -u '+time_utc=%Y-%m-%dT%H:%M:%SZ'
          sw_vers -productVersion | sed 's/^/macos_version=/' || true
          xcodebuild -version || true
          curl --version | head -n 1 || true
          echo 'System proxy flags:'
          scutil --proxy | awk '$1 ~ /^(HTTPEnable|HTTPSEnable|ProxyAutoConfigEnable|SOCKSEnable)$/ { print $1 "=" $3 }' || true
          echo 'CloudKit DNS addresses:'
          dscacheutil -q host -a name api.apple-cloudkit.com | awk '/^(name|ip_address):/ { print }' || true
          probe_https CloudKit-default 'https://api.apple-cloudkit.com/database/1/com.apple.gk.ticket-delivery/production/public/records/lookup'
          probe_https CloudKit-IPv4 'https://api.apple-cloudkit.com/database/1/com.apple.gk.ticket-delivery/production/public/records/lookup' --ipv4
          probe_https CloudKit-IPv6 'https://api.apple-cloudkit.com/database/1/com.apple.gk.ticket-delivery/production/public/records/lookup' --ipv6
          probe_https Apple-control 'https://www.apple.com/'
          echo '::endgroup::'
        }

        run_stapler() {
          local operation="$1" target="$2" status=0
          xcrun stapler "$operation" -v "$target" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "stapler $operation failed for $target with exit code $status" >&2
            cloudkit_diagnostics
          fi
          return "$status"
        }

        # Submission failure, rejection, or timeout must prevent publishing this build.
        xcrun notarytool submit "$dmg" \
          --key "$credentials_dir/AuthKey.p8" --key-id "$key_id" --issuer "$issuer" \
          --wait --timeout 30m --output-format json > "$credentials_dir/submission.json"
        cat "$credentials_dir/submission.json"
        jq -e '.status == "Accepted"' "$credentials_dir/submission.json" > /dev/null
        cloudkit_diagnostics
        run_stapler staple "$dmg"
        run_stapler validate "$dmg"
        spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

        # The updater ships the app rather than the DMG. Notarize and staple that exact
        # final app too; stapling only the disk image does not staple the updater app.
        ditto -c -k --keepParent updater-app/Macro.app "$credentials_dir/updater-app.zip"
        xcrun notarytool submit "$credentials_dir/updater-app.zip" \
          --key "$credentials_dir/AuthKey.p8" --key-id "$key_id" --issuer "$issuer" \
          --wait --timeout 30m --output-format json > "$credentials_dir/app-submission.json"
        jq -e '.status == "Accepted"' "$credentials_dir/app-submission.json" > /dev/null
        cloudkit_diagnostics
        run_stapler staple updater-app/Macro.app
        run_stapler validate updater-app/Macro.app
        codesign --verify --deep --strict --verbose=2 updater-app/Macro.app
        spctl --assess --type execute --verbose=2 updater-app/Macro.app
        version=$(jq -er '.version' apps/web/tauri/desktop-release.json)
        COPYFILE_DISABLE=1 tar -czf "artifacts/Macro-${version}-aarch64-darwin.app.tar.gz" -C updater-app Macro.app

        # Stapling changes the DMG bytes, so checksum the final distributable.
        (cd artifacts && shasum -a 256 -- *.dmg > macro-dmg-SHA256SUMS)
      shell: bash
      env:
        DOPPLER_TOKEN: ${{ secrets.MACOS_RELEASE_DOPPLER_TOKEN }}
    - name: Upload macro-dmg-${{ steps.metadata.outputs.safe_tag }} artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macro-dmg-${{ steps.metadata.outputs.safe_tag }}
        path: artifacts/*
        if-no-files-found: error
        retention-days: '30'
  publish-installers:
    needs:
    - resolve-ref
    - build-appimage
    - build-dmg
    name: Publish desktop installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - id: metadata
      name: Derive artifact metadata
      run: |
        set -euo pipefail
        tag="${RAW_REF#refs/tags/}"
        if [ -z "$tag" ]; then
          tag="${GITHUB_REF_NAME:-untagged}"
        fi
        safe_tag=$(printf '%s' "$tag" | sed 's#[/\\:*?"<>|]#-#g' | tr -d '\r\n')
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "safe_tag=$safe_tag" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        RAW_REF: ${{ needs.resolve-ref.outputs.ref }}
    - name: Download Build Artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        path: release-artifacts
        merge-multiple: 'true'
    - name: Upload Release Artifacts
      if: startsWith(steps.metadata.outputs.tag, 'v')
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
      with:
        tag_name: ${{ steps.metadata.outputs.tag }}
        files: release-artifacts/*
        fail_on_unmatched_files: 'true'
  publish-release:
    needs:
    - resolve-ref
    - publish-installers
    if: startsWith(needs.resolve-ref.outputs.ref, 'refs/tags/v')
    name: Sign and publish desktop updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-stable-publish
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ needs.resolve-ref.outputs.ref }}
        persist-credentials: 'false'
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - id: metadata
      name: Derive artifact metadata
      run: |
        set -euo pipefail
        tag="${RAW_REF#refs/tags/}"
        if [ -z "$tag" ]; then
          tag="${GITHUB_REF_NAME:-untagged}"
        fi
        safe_tag=$(printf '%s' "$tag" | sed 's#[/\\:*?"<>|]#-#g' | tr -d '\r\n')
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "safe_tag=$safe_tag" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        RAW_REF: ${{ needs.resolve-ref.outputs.ref }}
    - name: Download Build Artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        path: release-artifacts
        merge-multiple: 'true'
    - name: Sign updater artifacts
      run: |
        set -euo pipefail

        # All private material stays on the ephemeral runner, outside Nix derivations.
        umask 077
        credentials_dir=$(mktemp -d)
        trap 'rm -rf "$credentials_dir"' EXIT
        curl --fail --silent --show-error --retry 3 \
          --header "Authorization: Bearer $DOPPLER_TOKEN" \
          'https://api.doppler.com/v3/configs/config/secrets/download?project=macos-release&config=prd&format=json&secrets=TAURI_SIGNING_PRIVATE_KEY,TAURI_SIGNING_PRIVATE_KEY_PASSWORD' \
          > "$credentials_dir/secrets.json"
        # The Tauri signer rejects the newline that jq normally appends to raw output.
        jq -jer '.TAURI_SIGNING_PRIVATE_KEY | strings | select(length > 0)' \
          "$credentials_dir/secrets.json" > "$credentials_dir/updater.key"
        export TAURI_SIGNING_PRIVATE_KEY_PATH="$credentials_dir/updater.key"
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(jq -r '.TAURI_SIGNING_PRIVATE_KEY_PASSWORD // ""' "$credentials_dir/secrets.json")
        export TAURI_SIGNING_PRIVATE_KEY_PASSWORD

        # Verify against the public key compiled into BOTH packages before publishing.
        jq -er '.publicKey | select(length > 0)' release-artifacts/darwin-aarch64.release.json > "$credentials_dir/mac.pub"
        jq -er '.publicKey | select(length > 0)' release-artifacts/linux-x86_64.release.json > "$credentials_dir/linux.pub"
        cmp "$credentials_dir/mac.pub" "$credentials_dir/linux.pub"
        base64 --decode "$credentials_dir/mac.pub" > "$credentials_dir/minisign.pub"
        if ! gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json assets > "$credentials_dir/release.json"; then
          # Reading the collection must succeed before treating the version as absent.
          gh api --paginate --slurp "repos/$RELEASE_REPOSITORY/releases" > "$credentials_dir/releases.json"
          if jq -e --arg tag "$RELEASE_TAG" '.[][] | select(.tag_name == $tag)' "$credentials_dir/releases.json" >/dev/null; then
            echo "Could not inspect existing release assets" >&2
            exit 1
          fi
          printf '{"assets":[]}' > "$credentials_dir/release.json"
        fi
        shopt -s nullglob
        artifacts=(release-artifacts/*.app.tar.gz release-artifacts/*.AppImage)
        if [ "${#artifacts[@]}" -ne 2 ]; then
          echo "Expected one macOS and one Linux updater artifact" >&2
          exit 1
        fi
        for artifact in "${artifacts[@]}"; do
          name=$(basename "$artifact")
          if jq -e --arg name "$name.sig" '.assets | any(.name == $name)' "$credentials_dir/release.json" >/dev/null; then
            # Signatures include signing time. Reuse a previously published signature
            # only after checking both the immutable package bytes and its signature.
            gh release download "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --pattern "$name" --pattern "$name.sig" --dir "$credentials_dir"
            cmp "$artifact" "$credentials_dir/$name"
            cp "$credentials_dir/$name.sig" "$artifact.sig"
          else
            nix shell --inputs-from . nixpkgs#cargo-tauri --command cargo-tauri signer sign "$artifact"
          fi
          base64 --decode "$artifact.sig" > "$credentials_dir/artifact.minisig"
          nix shell --inputs-from . nixpkgs#minisign --command minisign \
            -Vm "$artifact" -p "$credentials_dir/minisign.pub" -x "$credentials_dir/artifact.minisig"
        done
      shell: bash
      env:
        DOPPLER_TOKEN: ${{ secrets.MACOS_RELEASE_DOPPLER_TOKEN }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        RELEASE_REPOSITORY: ${{ github.repository }}
    - name: Publish desktop release and update feed
      run: |
        set -euo pipefail

        nix develop --command bun apps/web/scripts/desktop-release.mjs manifest \
          release-artifacts "$RELEASE_TAG" "$RELEASE_REPOSITORY"

        # Refuse to overwrite release assets: the manifest may already reference them.
        # A failed publication can be resumed if every existing asset has identical bytes.
        if ! gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --verify-tag \
            --title "Macro $RELEASE_TAG" --notes "Desktop release $RELEASE_TAG" --latest=false
        fi
        work_dir=$(mktemp -d)
        trap 'rm -rf "$work_dir"' EXIT
        gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json assets > "$work_dir/release.json"
        for file in release-artifacts/*; do
          name=$(basename "$file")
          # The mutable feed is published only after the immutable packages.
          [ "$name" != latest.json ] || continue
          if jq -e --arg name "$name" '.assets | any(.name == $name)' "$work_dir/release.json" >/dev/null; then
            gh release download "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --pattern "$name" --dir "$work_dir"
            cmp "$file" "$work_dir/$name"
          else
            gh release upload "$RELEASE_TAG" "$file" --repo "$RELEASE_REPOSITORY"
          fi
        done

        # A dedicated prerelease hosts only the mutable pointer. It never becomes the
        # public download page's latest release, nor follows SDK/daemon release tags.
        if gh release view desktop-stable --repo "$RELEASE_REPOSITORY" --json assets > "$work_dir/channel.json"; then
          if jq -e '.assets | any(.name == "latest.json")' "$work_dir/channel.json" >/dev/null; then
            gh release download desktop-stable --repo "$RELEASE_REPOSITORY" --pattern latest.json --dir "$work_dir"
            result=0
            nix develop --command bun apps/web/scripts/desktop-release.mjs newer \
              release-artifacts/latest.json "$work_dir/latest.json" || result=$?
            if [ "$result" -eq 2 ]; then
              echo "A matching or newer desktop release is already promoted."
              exit 0
            fi
            [ "$result" -eq 0 ] || exit "$result"
          fi
        else
          # Do not mistake an authentication/network error for an absent release.
          gh api --paginate --slurp "repos/$RELEASE_REPOSITORY/releases" > "$work_dir/releases.json"
          if jq -e '.[][] | select(.tag_name == "desktop-stable")' "$work_dir/releases.json" >/dev/null; then
            echo "Could not read the existing desktop update channel" >&2
            exit 1
          fi
          gh release create desktop-stable --repo "$RELEASE_REPOSITORY" --target "$RELEASE_TAG" \
            --prerelease --latest=false --title "Desktop stable update feed" \
            --notes "Update metadata only. Download installers from a versioned desktop release."
        fi
        gh release upload desktop-stable release-artifacts/latest.json --repo "$RELEASE_REPOSITORY" --clobber
        gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --latest
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        RELEASE_REPOSITORY: ${{ github.repository }}
concurrency:
  group: ${{ inputs.ref == 'diagnose-staple' && 'cloudkit-staple-diagnostic-' || inputs.ref == 'diagnose-cloudkit' && 'cloudkit-diagnostic-' || '' }}desktop-${{ inputs.ref || (github.event.ref_type == 'tag' && github.event.ref || github.ref_name) }}
  cancel-in-progress: true
