            "$dir/tcpdump.pid" -i "$interface" -n -U -s 96 \
            -w "$dir/cloudkit.pcap" 'port 443 and net 17.0.0.0/8' \
            > "$dir/tcpdump.stdout" 2> "$dir/tcpdump.stderr" &
