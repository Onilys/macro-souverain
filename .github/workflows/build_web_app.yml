# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/build_web_app.rs
name: Build Web App
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: The environment to build for. e.g. (dev, prod)
    secrets:
      SEGMENT_WRITE_KEY:
        required: true
      POSTHOG_API_KEY:
        required: true
jobs:
  build:
    name: Build
    runs-on: namespace-profile-linux-mid;overrides.cache-tag=web-ci
    env:
      CI: 'true'
    steps:
    - name: Checkout Repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ github.sha }}
    - name: Mount Namespace cache volume
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
      with:
        cache: nix
        path: |-
          /home/runner/.bun/install/cache
          /home/runner/.cargo/registry
          /home/runner/.cargo/git
          /home/runner/.cache/.wasm-pack
          /home/runner/.cache/kache
      continue-on-error: true
    - name: Setup Nix
      uses: ./.github/actions/setup-nix
    - name: Setup
      uses: ./.github/actions/setup-reqs-web
    - name: Configure kache
      run: |
        set -euo pipefail
        {
          echo "KACHE_CACHE_DIR=$KACHE_VOLUME_DIR"
          echo "KACHE_MAX_SIZE=$KACHE_VOLUME_MAX_SIZE"
          echo "KACHE_RUNTIME_DIR=$RUNNER_TEMP/kache"
          echo "KACHE_TRUST_DOMAIN=deploy"
          echo "KACHE_LOCAL_ONLY=1"
        } >> "$GITHUB_ENV"
      shell: bash
      env:
        KACHE_VOLUME_DIR: /home/runner/.cache/kache
        KACHE_VOLUME_MAX_SIZE: 30GiB
    - name: Build
      run: just build-${{ inputs.environment }}
      env:
        VITE_SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY }}
        VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        VITE_OTEL_EXPORTER_URL: ${{ inputs.environment == 'prod' && 'https://macro-prox-prod.macroverse.workers.dev/i/otlp/v1/traces' || 'https://macro-prox-dev.macroverse.workers.dev/i/otlp/v1/traces' }}
        VITE_OTEL_ENV: ${{ inputs.environment == 'prod' && 'prod' || 'development' }}
      working-directory: apps/web
    - name: Report kache stats
      if: always()
      run: |
        kache stats || true

        # Which crates compiled instead of coming from the cache, costliest first.
        # The key prefix matches `kache explain`'s, so a miss can be compared with
        # the key a developer machine published for the same crate.
        events="${KACHE_RUNTIME_DIR:-$KACHE_CACHE_DIR${KACHE_TRUST_DOMAIN:+/$KACHE_TRUST_DOMAIN}}/events.jsonl"
        if [ -f "$events" ]; then
          echo "Costliest kache misses (compile ms, crate, key):"
          jq -r 'select(.result == "miss") | "\(.compile_time_ms // 0)\t\(.crate_name)\t\(.cache_key[0:12])"' \
            "$events" | sort -rn | head -60 || true
        fi

        kache daemon stop || true
      shell: bash
    - name: Upload dist
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: web-app-dist-${{ inputs.environment }}
        path: apps/web/dist
        if-no-files-found: error
        retention-days: '1'
        overwrite: 'true'
    - name: Teardown Nix
      if: always()
      uses: ./.github/actions/teardown-nix
