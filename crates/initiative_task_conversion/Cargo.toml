[package]
name = "initiative_task_conversion"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
document_sub_type = { path = "../document_sub_type" }
documents = { path = "../documents", default-features = false, features = ["ports"] }
entity_access = { path = "../entity_access", default-features = false, features = ["ports"] }
entity_mutation = { path = "../entity_mutation" }
initiative = { path = "../initiative", default-features = false, features = ["ports"] }
macro_sync_service_jwt = { path = "../macro_sync_service_jwt" }
macro_user_id = { path = "../macro_user_id" }
messages = { path = "../messages", features = ["ports"] }
model = { path = "../model" }
model-entity = { path = "../model-entity" }
models_permissions = { path = "../models_permissions" }
models_properties = { path = "../models_properties" }
properties = { path = "../properties", default-features = false, features = ["ports"] }
rootcause = { workspace = true }
sync_service_client = { path = "../sync_service_client" }
system_properties = { path = "../system_properties" }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
